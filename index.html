<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Bâtiments - Empire Immo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        #resultats {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* Style pour afficher le code proprement */
        pre {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .erreur {
            color: #c0392b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Tableau de bord Empire Immo</h1>
    <p>Cliquez sur le bouton ci-dessous pour interroger l'API et récupérer la liste de vos bâtiments.</p>
    
    <button onclick="chargerDonnees()">Charger mes bâtiments</button>

    <div id="resultats">
        <p><em>Les données apparaîtront ici...</em></p>
    </div>

    <script>
        // Le lien de votre API
        const apiUrl = 'https://monde8.empireimmo.com/api/buildings.json?key=eiK8_cf882f4ff42f19518a95a22e3268cf8e';

        function chargerDonnees() {
            const zoneResultat = document.getElementById('resultats');
            zoneResultat.innerHTML = "<p><em>Connexion à Empire Immo en cours...</em></p>";

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erreur serveur : ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    // Pour le moment, on affiche tout le JSON de manière brute mais jolie
                    zoneResultat.innerHTML = "<h3>Succès ! Voici vos données brutes :</h3>" + 
                                             "<pre>" + JSON.stringify(data, null, 4) + "</pre>";
                })
                .catch(error => {
                    zoneResultat.innerHTML = 
                        "<p class='erreur'>Impossible de charger les données : " + error.message + "</p>" +
                        "<p><strong>Note :</strong> Si le jeu bloque les requêtes directes depuis le navigateur (erreur CORS), il faudra passer par un langage comme Python ou PHP.</p>";
                });
        }
    </script>
</body>
</html>
